})}
/* Browser preview only (no Android bridge) */
const MOCK_USER={serviceStatusColor:{visible:true,value:'Green'},accountPrice:{visible:true,displayName:'سعر الاشتراك',value:'40,000 IQD'},accountStatus:{visible:true,displayName:'حالة الاشتراك',value:'فعال'},accountName:{visible:true,displayName:'نوع الاشتراك',value:'Plus'},fullName:{visible:true,displayName:'الاسم الكامل',value:' '},userID:{visible:true,displayName:'اسم المستخدم',value:'em@sa39'},agentName:{visible:true,displayName:'اسم الوكيل',value:'LqBaji7'},accountExpirationDate:{visible:true,displayName:'تاريخ نفاذ الصلاحية',value:'16/11/2026 06:30:00 م'},activeDaysLeft:{visible:true,displayName:'الايام المتبقية',value:'13'},userIP:{visible:true,displayName:'عنوان IP',value:'100.105.31.12'},mobileNumber:{visible:true,displayName:'رقم الهاتف',value:null}};

/* ---------- Rules: thresholds, wording and suggested fixes ---------- */

 {chip:'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300',txt:'text-emerald-600 dark:text-emerald-400',box:'',bar:'#10b981',ic:'check_circle'},

 {id:'chains',term:'Chain',label:'توازن الهوائيين',icon:'compare_arrows',unit:'dB',get:s=>{const c=ch(s);return c.length<2?null:Math.abs(c[0]-c[1])},show:(v,s)=>v,hi:0,t:[8,15],range:'الجيد فرق أقل من 8 · المتوسط حتى 15',txt:['متوازن','فرق بسيط','غير متوازن'],

 {id:'ccq',term:'CCQ',label:'جودة الاتصال',icon:'verified',unit:'%',get:s=>Math.round(W(s).ccq/10),hi:1,t:[85,70],range:'الجيد أعلى من 85 · المتوسط حتى 70',txt:['ممتازة','متوسطة','ضعيفة'],

 {id:'quality',term:'airMAX Quality',label:'جودة airMAX',icon:'speed',unit:'%',get:s=>P(s).enabled?P(s).quality:null,hi:1,t:[70,50],range:'الجيد أعلى من 70 · المتوسط حتى 50',txt:['جيدة','متوسطة','ضعيفة'],

function parseExp(v){const m=/^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::\d{2})?\s*([صم])?/.exec(String(v));if(!m)return null;const d=+m[1],mo=+m[2],y=+m[3];if(mo<1||mo>12||d<1||d>31)return null;
 return{day:DAYN[new Date(y,mo-1,d).getDay()],date:d+' '+MON[mo-1]+' '+y,short:d+' '+MON[mo-1],time:(+m[4])+':'+m[5]+(m[6]==='م'?' مساءً':m[6]==='ص'?' صباحاً':'')}}

 return `<section class="${CARD} p-4 flex items-center gap-3">${chipIc(err?'cloud_off':'hourglass_top','bg-slate-100 text-slate-500 dark:bg-zinc-800 dark:text-zinc-400')}<div class="flex-1 min-w-0"><div class="font-bold text-sm">${err?'تعذر تحميل معلومات الاشتراك':'جارٍ تحميل معلومات الاشتراك...'}</div>${err?'<div class="text-xs text-slate-500 dark:text-zinc-400 mt-0.5 leading-relaxed">لا يؤثر هذا على قراءات الإشارة، فمصدر المعلومتين مختلف.</div>':''}</div>${err?'<button id="uRetry" class="h-11 px-4 rounded-full bg-accent-100 text-accent-700 dark:bg-accent-500/15 dark:text-accent-400 text-sm font-bold">إعادة المحاولة</button>':''}</section>`}

const pollMs=()=>{const v=store.get('poll',APP_CONFIG.pollMs);return[1000,2000,5000].includes(v)?v:APP_CONFIG.pollMs};
async function connect(c){
  await call('nanoLogin',{ip:c.ip,username:c.username,password:c.password});
  S.st=await call('nanoStatus',{ip:c.ip});S.c=c;S.on=true;fails=0;S.user=null;S.uState='load';
  store.set('creds',c);store.set('auto',true);show('home');render();schedule();loadUser()}
const errMsg=e=>(e&&e.message)||'تعذر الاتصال بالنانو. تأكد من الـ IP وبيانات الدخول.';

function schedule(){clearTimeout(timer);timer=setTimeout(async()=>{if(S.on&&!document.hidden)await refresh();if(S.on)schedule()},pollMs())}
async function refresh(manual){if(busy||!S.on)return;busy=true;$('#rfIcon').addClass('animate-spin');
  try{S.st=await call('nanoStatus',{ip:S.c.ip});fails=0;render();if(manual)toast('تم التحديث');if(S.uState==='err'&&(manual||Date.now()-S.uTry>30000))loadUser()}
  catch(e){try{await call('nanoLogin',S.c);S.st=await call('nanoStatus',{ip:S.c.ip});fails=0;render()}
   catch(e2){fails++;toast('تعذر تحديث الإشارة','error');if(fails>=3)showLogin(errMsg(e2),S.c)}}
  finally{busy=false;$('#rfIcon').removeClass('animate-spin')}}
$(document).on('visibilitychange',()=>{if(!document.hidden&&S.on)refresh()});
$('#btnRefresh').on('click',()=>refresh(true));

$('#loginForm').on('submit',async ev=>{ev.preventDefault();
  const c={ip:$('#fIp').val().trim(),username:$('#fUser').val().trim(),password:$('#fPass').val()};
  if(!/^[\w.\-:]+$/.test(c.ip))return $('#loginErr').removeClass('hidden').text('أدخل عنوان IP صحيحاً للنانو.');
  if(!c.username)return $('#loginErr').removeClass('hidden').text('أدخل اسم المستخدم.');
  $('#loginErr').addClass('hidden');setBtn(true);
  try{await connect(c)}catch(e){showLogin(errMsg(e),c)}});
$('.ipChip').on('click',function(){$('#fIp').val($(this).data('ip')).trigger('focus')});
$('#togglePass').on('click',()=>{const p=$('#fPass'),h=p.attr('type')==='password';p.attr('type',h?'text':'password');$('#togglePass .mi').text(h?'visibility_off':'visibility')});

/* ---------- Share, theme, settings ---------- */
$('#btnShare').on('click',()=>{const s=S.st;if(!s)return;const v=val(M.signal,s),u=S.user,d=u&&u.activeDaysLeft?u.activeDaysLeft.value:null;
  const t=['اشتراكي نت',W(s).essid?'السكتر: '+W(s).essid:'','قوة الإشارة: '+v+' dBm ('+M.signal.txt[rate(M.signal,v)]+')',val(M.snr,s)!=null?'SNR: '+val(M.snr,s)+' dB':'',val(M.ccq,s)!=null?'CCQ: '+val(M.ccq,s)+'%':'',d?'الأيام المتبقية: '+d:''].filter(Boolean).join('\n');
  call('share',{text:t}).catch(()=>toast('تعذرت المشاركة','error'))});
function applyTheme(d,save){const r=document.documentElement;r.classList.toggle('dark',d);r.style.colorScheme=d?'dark':'light';$('meta[name=theme-color]').attr('content',d?'#09090b':'#f0f9ff');$('#themeIcon').text(d?'light_mode':'dark_mode');if(save)store.set('theme',d?'dark':'light')}
$('#btnTheme').on('click',()=>applyTheme(!document.documentElement.classList.contains('dark'),true));
const setPollUI=()=>$('.pollBtn').each(function(){const a=+this.dataset.ms===pollMs();$(this).toggleClass('bg-white dark:bg-zinc-700 shadow text-accent-700 dark:text-accent-400',a).toggleClass('text-slate-500 dark:text-zinc-400',!a).attr('aria-pressed',a)});
$('.pollBtn').on('click',function(){store.set('poll',+this.dataset.ms);setPollUI();if(S.on)schedule()});
const openM=()=>{setPollUI();$('#mData').val('');$('#modal').removeClass('hidden').addClass('flex')},closeM=()=>$('#modal').addClass('hidden').removeClass('flex');
$('#btnMenu').on('click',openM);$('#mClose').on('click',closeM);$('#modal').on('click',e=>{if(e.target.id==='modal')closeM()});
$(document).on('keydown',e=>{if(e.key==='Escape')closeM()});
$('#mExport').on('click',()=>{const j=JSON.stringify({app:'eshtiraki',creds:store.get('creds',null),theme:store.get('theme',null)},null,2);$('#mData').val(j);
  if(window.Android)call('share',{text:j}).catch(()=>{});
  else try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='eshtiraki-backup.json';a.click()}catch(e){toast('انسخ النص يدوياً','error')}});
function doImport(txt){try{const d=JSON.parse(txt);if(d.app!=='eshtiraki'||!d.creds||!d.creds.ip)throw 0;store.set('creds',d.creds);if(d.theme){store.set('theme',d.theme);applyTheme(d.theme==='dark')}closeM();toast('تم استيراد البيانات');showLogin('',d.creds)}catch(e){toast('ملف غير صالح','error')}}
$('#mImport').on('click',()=>doImport($('#mData').val()));
$('#mFile').on('change',function(){const f=this.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$('#mData').val(r.result);r.readAsText(f)});
$('#mLogout').on('click',()=>{store.set('auto',false);closeM();showLogin('',store.get('creds',null))});

/* ---------- Boot ---------- */
$('#appName').text(APP_CONFIG.name);$('#mVer').text(APP_CONFIG.name+' · v'+APP_CONFIG.version);
applyTheme(document.documentElement.classList.contains('dark'),false);
(async()=>{const c=store.get('creds',null);
  if(c&&c.ip&&store.get('auto',true)){show('splash');try{await connect(c)}catch(e){showLogin(errMsg(e),c)}}else showLogin('',c)})();
});
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")</script>
</body>
</html>
