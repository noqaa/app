name: Auto Localize Static Sites

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.set-matrix.outputs.dirs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find projects with .localize.json
        id: set-matrix
        run: |
          DIRS=$(find . -name ".localize.json" -exec dirname {} \; | sed 's|^\./||' | jq -R -s -c 'split("\n")[:-1]')
          echo "Found directories: $DIRS"
          echo "dirs=$DIRS" >> $GITHUB_OUTPUT

  localize:
    needs: discover
    runs-on: ubuntu-latest
    if: ${{ needs.discover.outputs.directories != '[]' && needs.discover.outputs.directories != '' }}
    
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.directories) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Localize Script for ${{ matrix.dir }}
        env:
          DIR: ${{ matrix.dir }}
        run: node .github/scripts/localize.mjs

      - name: Commit and Push changes if any
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(localize): update local assets and styles for ${{ matrix.dir }}"
          file_pattern: "${{ matrix.dir }}/*"